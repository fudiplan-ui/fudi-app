name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Webseite/package-lock.json

      - name: Install dependencies
        working-directory: ./Webseite
        run: npm ci

      - name: Typecheck
        working-directory: ./Webseite
        run: npm run typecheck

      - name: Unit tests
        working-directory: ./Webseite
        run: npm test

      - name: Build
        working-directory: ./Webseite
        run: npm run build

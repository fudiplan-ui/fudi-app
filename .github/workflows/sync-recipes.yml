name: Hermes Rezept-Sync

on:
  schedule:
    # Jeden Montag 06:00 UTC – sucht neue Rezepte
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync-recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Neue Rezepte suchen & importieren
        run: node scripts/syncRecipes.mjs

      - name: Typecheck & Tests
        working-directory: ./Webseite
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Commit & Push (nur bei Änderungen)
        run: |
          git config user.name "Hermes Fudi Engine"
          git config user.email "hermes@fudi.app"
          git add Webseite/src/data/recipesDatabase.ts
          if git diff --cached --quiet; then
            echo "Keine neuen Rezepte – nichts zu committen."
          else
            git commit -m "feat(hermes): neue Rezepte aus TheMealDB-Import (Nährwerte geschätzt, per source gekennzeichnet)"
            git push
          fi
